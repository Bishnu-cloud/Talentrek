{% extends "base.html" %}
{% block title %}Company Profile | Talentrek{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-950 text-white font-sans pb-20">
    <main class="max-w-2xl mx-auto px-8 py-12">
        <div class="mb-10 text-center">
            <h1 class="text-3xl font-black uppercase tracking-tighter">Setup Company Identity</h1>
            <p class="text-slate-500 text-xs font-bold uppercase tracking-[0.2em] mt-2">Visible to all potential candidates</p>
        </div>

        <form method="POST" class="bg-slate-900/50 border border-slate-800 p-10 rounded-[2.5rem] shadow-2xl space-y-8">
            {% csrf_token %}
            
            <div class="space-y-2">
                <label class="text-[10px] font-black uppercase tracking-[0.3em] text-indigo-500">Official Company Name</label>
                <input type="text" name="company_name" value="{{ profile.company_name|default:'' }}" required
                       placeholder="e.g. Stark Industries"
                       class="w-full px-6 py-4 bg-slate-950 border border-slate-800 rounded-2xl text-white outline-none focus:border-indigo-500 transition-all font-bold">
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-black uppercase tracking-[0.3em] text-indigo-500">Website URL</label>
                <input type="url" name="website_link" value="{{ profile.website_link|default:'' }}"
                       placeholder="https://company.com"
                       class="w-full px-6 py-4 bg-slate-950 border border-slate-800 rounded-2xl text-white outline-none focus:border-indigo-500 transition-all font-bold">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black uppercase tracking-[0.2em] py-5 rounded-2xl shadow-lg shadow-indigo-500/20 transition-all active:scale-95">
                Save Company Profile
            </button>
        </form>
    </main>
</div>
{% endblock %}
